<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Shadow Realm — Manhwa Reader</title>
<style>
:root{
  --bg:#06010a;--panel:#12041a;--muted:#bfb3ff80;--accent:#8a3dff;--glow:rgba(138,61,255,0.18);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:radial-gradient(ellipse at 20% 10%, #0b0120 0%, var(--bg) 40%), linear-gradient(180deg,#050014, #06010a 60%);
  color: #efe8ff;font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; overflow-y:auto;
}
header{
  position:sticky;top:0;z-index:40;padding:14px 18px;background:linear-gradient(90deg, rgba(10,2,30,0.6), rgba(6,1,10,0.4));backdrop-filter: blur(6px);
  display:flex;gap:12px;align-items:center;box-shadow:0 6px 30px var(--glow);
}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;background:linear-gradient(135deg,#3b0cff,#6b2bff);border-radius:9px;box-shadow:0 6px 20px #6b2bff40;display:flex;align-items:center;justify-content:center;font-weight:800;color:white}
.title{font-size:18px;font-weight:700}
.controls{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{background:linear-gradient(180deg, #1a0630, #140223);padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.03);cursor:pointer;color:var(--muted);font-weight:600;box-shadow:0 6px 16px #6a00ff20}
.btn:active{transform:translateY(1px)}
.container{max-width:940px;margin:18px auto;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:linear-gradient(180deg,#14031a,#0f0316);padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 8px 30px #6a00ff10;cursor:pointer}
.card h3{margin:0 0 6px 0;font-size:16px}
.small{font-size:13px;color:var(--muted)}
.reader{max-width:720px;margin:0 auto;padding:10px 6px}
.readerHeader{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.chTitle{font-size:16px;font-weight:700}
.progressWrap{flex:1}
.progress{height:8px;background:rgba(255,255,255,0.06);border-radius:6px;overflow:hidden}
.progressBar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#5e2bff)}
.tools{display:flex;gap:8px}
.imgWrap{margin-bottom:18px}
.reader img{width:100%;height:auto;border-radius:8px;display:block;transform-origin:center;transition:transform .2s ease;object-fit:contain}
.footerNote{color:var(--muted);text-align:center;margin-top:12px;font-size:13px}
/* modal */
.modal{position:fixed;inset:0;background:linear-gradient(90deg, rgba(12,2,20,0.6), rgba(6,1,10,0.6));backdrop-filter: blur(8px);display:flex;align-items:center;justify-content:center;z-index:80}
.modalCard{max-width:680px;width:94%;background:linear-gradient(180deg,#0f0316,#09010c);padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,0.03)}
.row{display:flex;gap:8px;align-items:center}
.select{padding:8px;border-radius:8px;background:#0a0215;color:var(--muted);border:1px solid rgba(255,255,255,0.03)}
.smallBtn{padding:6px 8px;border-radius:8px;background:#1a0630;border:1px solid rgba(255,255,255,0.03);cursor:pointer;color:var(--muted)}
.chapter-btn{padding:8px 12px;background:linear-gradient(180deg,#1a0630,#140223);border-radius:8px;color:var(--muted);cursor:pointer}
.chapter-btn:hover{background:linear-gradient(180deg,#2c0b44,#1f0452)}
/* responsive */
@media (max-width:640px){.grid{grid-template-columns:repeat(1,1fr)}header{padding:12px}.container{padding:8px}.reader{padding:6px}.logo{width:38px;height:38px}}
/* loading skeleton */
.skel{background:linear-gradient(90deg,#0e0420,#15042a,#0e0420);height:280px;border-radius:8px;animation:shimmer 1.4s linear infinite;background-size:200% 100%}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">SR</div>
    <div>
      <div class="title">Shadow Realm Reader</div>
      <div class="small">Dark • Fast • Free (GitHub Pages)</div>
    </div>
  </div>
  <div class="controls">
    <button class="btn" id="homeBtn">Home</button>
    <button class="btn" id="chapBtn">Chapters</button>
    <button class="btn" id="settingsBtn">Settings</button>
    <button class="btn" id="fullscreenBtn">Fullscreen</button>
  </div>
</header>
<main class="container" id="app">
  <!-- content generated by JS -->
</main>

<div id="modal" style="display:none"></div>

<script>
/* ====== CONFIG ====== */
const BASE_URL = 'https://<your-username>.github.io/manhwa-reader'; // <<-- REPLACE with your GitHub Pages URL
const MANHWAS = {
  'solo-leveling': { title: 'Solo Leveling', chapters: 180 },
  'lookism': { title: 'Lookism', chapters: 398 }
};

/* ====== UTILS ====== */
const $ = sel=> document.querySelector(sel);
const create = (el, props = {})=> Object.assign(document.createElement(el), props);

/* ====== STATE ====== */
let state = { view: 'home', slug: null, chapter: 1, pages: [], pageCount:0, prefetch:3, fit:'contain', autoplayNext:true, lastRead:{} };
const LS_KEY = 'sr_reader_v2';
function loadState(){ try{const saved=JSON.parse(localStorage.getItem(LS_KEY)||'{}'); Object.assign(state,saved)}catch(e){} }
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
loadState();

/* ====== HOME ====== */
function renderHome(){
  state.view='home';
  const app = $('#app'); app.innerHTML = `<h2 style="margin:6px 0 12px 0">Browse Manhwas</h2>`;
  const grid = create('div'); grid.className='grid';
  for(const slug in MANHWAS){
    const m = MANHWAS[slug];
    const card = create('div'); card.className='card';
    card.innerHTML = `<h3>${m.title}</h3><div class='small'>${m.chapters} chapters</div>`;
    card.onclick = ()=> openChapters(slug);
    grid.appendChild(card);
  }
  app.appendChild(grid);
  app.innerHTML += `<div class='footerNote'>Tip: Click a title → choose chapter → read. Images load from GitHub Pages.</div>`;
}

/* ====== CHAPTER SELECTOR ====== */
function openChapters(slug){
  state.view='chapters'; state.slug=slug;
  const m = MANHWAS[slug];
  const app = $('#app'); app.innerHTML='';
  const top = create('div'); top.innerHTML = `<div style='margin-bottom:8px;'><button class='smallBtn' onclick="renderHome()">← Back</button></div><h2 style='margin:6px 0'>${m.title}</h2>`;
  app.appendChild(top);
  const wrap = create('div'); wrap.style.display='flex'; wrap.style.flexWrap='wrap'; wrap.style.gap='8px';
  for(let i=m.chapters;i>=1;i--){
    const b = create('div'); b.className='chapter-btn'; b.textContent='Chapter '+i; b.onclick=()=> openReader(slug,i);
    wrap.appendChild(b);
  }
  app.appendChild(wrap);
}

/* ====== READER ====== */
function openReader(slug, chapter){
  state.view='reader'; state.slug=slug; state.chapter=chapter; state.pages=[]; state.pageCount=0;
  state.lastRead[slug] = {chapter, timestamp:Date.now()};
  saveState();

  const app = $('#app'); app.innerHTML='';
  const header = create('div'); header.className='readerHeader';
  const chTitle = create('div'); chTitle.className='chTitle'; chTitle.textContent = `${MANHWAS[slug].title} — Chapter ${chapter}`;
  const progressWrap = create('div'); progressWrap.className='progressWrap'; progressWrap.innerHTML = `<div class='progress'><div class='progressBar' id='progBar'></div></div>`;
  header.appendChild(chTitle); header.appendChild(progressWrap);

  const tools = create('div'); tools.className='tools';
  const prev = create('button'); prev.className='smallBtn'; prev.textContent='Prev Ch'; prev.onclick=()=> changeChapter(-1);
  const next = create('button'); next.className='smallBtn'; next.textContent='Next Ch'; next.onclick=()=> changeChapter(1);
  const fit = create('button'); fit.className='smallBtn'; fit.textContent='Fit: '+state.fit; fit.onclick=()=> toggleFit(fit);
  tools.append(prev,next,fit);
  header.appendChild(tools);
  app.appendChild(header);

  const reader = create('div'); reader.className='reader'; reader.id='reader';
  app.appendChild(reader);

  let pageIndex = 1; let consecutiveErrors = 0; const maxErrors = 6; const prefetch = state.prefetch || 3;

  function loadNext(){
    const url = `${BASE_URL}/${slug}/${chapter}/${String(pageIndex).padStart(3,'0')}.webp`;
    const imgWrap = create('div'); imgWrap.className='imgWrap';
    const sk = create('div'); sk.className='skel'; imgWrap.appendChild(sk);
    reader.appendChild(imgWrap);
    const img = new Image(); img.decoding='async'; img.src = url;
    img.onload = ()=>{
      consecutiveErrors = 0; img.style.opacity=0; img.className='readerImg'; setTimeout(()=>{ img.style.opacity=1 },20);
      imgWrap.innerHTML=''; imgWrap.appendChild(img);
      state.pages.push(url); state.pageCount = state.pages.length; updateProgress();
      for(let k=1;k<=prefetch;k++){ const p = pageIndex+k; const u=`${BASE_URL}/${slug}/${chapter}/${String(p).padStart(3,'0')}.webp`; const im=new Image(); im.src=u }
      pageIndex++;
      if(consecutiveErrors<maxErrors) loadNext();
    };
    img.onerror = ()=>{ consecutiveErrors++; if(consecutiveErrors<maxErrors){ pageIndex++; loadNext() } else { maybeAutoNext(); } }
  }
  loadNext();

  document.onkeydown = function(e){ if(e.key==='ArrowRight') window.scrollBy({top:window.innerHeight,behavior:'smooth'}); if(e.key==='ArrowLeft') window.scrollBy({top:-window.innerHeight,behavior:'smooth'}); if(e.key==='n') changeChapter(1); if(e.key==='p') changeChapter(-1) };
  let lastTap=0; document.getElementById('reader').ontouchend = function(ev){ const t=Date.now(); if(t-lastTap<300){ window.scrollBy({top:window.innerHeight,behavior:'smooth'}) } lastTap=t };
}

function updateProgress(){ const bar = $('#progBar'); if(!bar) return; const total = Math.max(1, state.pageCount); const visible = Math.min(total, Math.ceil((window.scrollY+window.innerHeight)/800)); const pct = Math.min(100, Math.round((visible/Math.max(1,total))*100)); bar.style.width = pct+'%'; }

function changeChapter(delta){ const m = MANHWAS[state.slug]; let next = state.chapter + delta; if(next<1) next=1; if(next>m.chapters) return; openReader(state.slug,next); window.scrollTo({top:0}); }
function maybeAutoNext(){ if(state.autoplayNext){ const m = MANHWAS[state.slug]; if(state.chapter < m.chapters){ setTimeout(()=>{ changeChapter(1); window.scrollTo({top:0}) }, 700) } } }
function toggleFit(button){ state.fit = state.fit==='contain'?'cover':'contain'; button.textContent='Fit: '+state.fit; document.querySelectorAll('.reader img').forEach(i=> i.style.objectFit = state.fit); saveState(); }

/* SETTINGS MODAL */
function openSettings(){ const modal = $('#modal'); modal.style.display='block'; modal.innerHTML = `<div class='modal'><div class='modalCard'>
  <h3>Settings</h3>
  <div style='margin-top:8px'><label class='small'>Prefetch images (0-6)</label><br><input id='prefetch' class='select' type='number' min='0' max='6' value='${state.prefetch}' /></div>
  <div style='margin-top:8px'><label class='small'>Auto-next chapter</label><br><select id='auto' class='select'><option value='1'>On</option><option value='0'>Off</option></select></div>
  <div style='margin-top:10px' class='row'><button class='smallBtn' id='saveSettings'>Save</button><button class='smallBtn' id='closeSettings'>Close</button></div>
</div></div>`;
  $('#modal .modal').onclick = (e)=>{ if(e.target===$('#modal .modal')) closeModal() };
  $('#auto').value = state.autoplayNext? '1':'0';
  $('#saveSettings').onclick = ()=>{ state.prefetch = Math.max(0, Math.min(6, parseInt($('#prefetch').value||0))); state.autoplayNext = $('#auto').value==='1'; saveState(); closeModal(); alert('Saved') }
  $('#closeSettings').onclick = closeModal;
}
function closeModal(){ const modal = $('#modal'); modal.style.display='none'; modal.innerHTML=''; }

/* FULLSCREEN */
function toggleFullscreen(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }

/* INIT BUTTONS */
document.getElementById('homeBtn').onclick = renderHome;
document.getElementById('chapBtn').onclick = ()=>{ if(state.slug) openChapters(state.slug); else openChapters(Object.keys(MANHWAS)[0]); };
document.getElementById('settingsBtn').onclick = openSettings;
document.getElementById('fullscreenBtn').onclick = toggleFullscreen;
window.addEventListener('scroll', ()=>{ updateProgress(); });

// FIRST RENDER
if(Object.keys(state.lastRead).length>0){ const lastSlug=Object.keys(state.lastRead)[0]; openReader(lastSlug,state.lastRead[lastSlug].chapter) } else { renderHome() }
</script>
</body>
</html>
